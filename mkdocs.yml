site_name: setqca
site_description: Native Python toolkit for crisp-set and fuzzy-set Qualitative Comparative Analysis
site_author: Diogo Ribeiro
site_url: https://diogoribeiro7.github.io/setqca-python/
repo_url: https://github.com/DiogoRibeiro7/setqca-python
repo_name: DiogoRibeiro7/setqca-python
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Diogo Ribeiro — MIT licensed

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - User guide:
      - Calibration: guide/calibration.md
      - Expressions: guide/expressions.md
      - Truth tables: guide/truth-tables.md
      - Minimisation: guide/minimisation.md
  - Methodology: METHODOLOGY.md
  - Architecture: ARCHITECTURE.md
  - Validation:
      - Policy and parity: VALIDATION.md
      - Mathematical audit: mathematical_validation.md
  - API reference: reference.md
  - Roadmap: ROADMAP.md
  - Contributing: contributing.md
  - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            members_order: source
            merge_init_into_class: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/DiogoRibeiro7
    - icon: fontawesome/brands/orcid
      link: https://orcid.org/0009-0001-2022-7072

watch:
  - src/setqca
