name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==2.2.1

      - name: Install dependencies
        run: poetry install --with dev --no-interaction

      - name: Confirm the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared="$(poetry version --short)"
          if [ "$tag" != "$declared" ]; then
            echo "::error::Tag v$tag does not match pyproject version $declared"
            exit 1
          fi

      - name: Quality gate
        run: |
          poetry run ruff check .
          poetry run ruff format --check .
          poetry run mypy
          poetry run pytest --cov=setqca

  build:
    name: Build distributions
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==2.2.1

      - name: Build sdist and wheel
        run: poetry build

      - name: Check distribution metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/setqca
    permissions:
      # Required for PyPI trusted publishing; no API token is stored anywhere.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Publish via trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Publish release with artefacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            See [CHANGELOG.md](https://github.com/DiogoRibeiro7/setqca-python/blob/main/CHANGELOG.md)
            for the curated list of changes in this release.
